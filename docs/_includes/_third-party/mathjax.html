{% if site.mathjax.enable %}
  {% if page.mathjax or site.mathjax.per_page == nil or site.mathjax.per_page == false %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
      };
    </script>
    <script defer src="{{ site.mathjax.cdn }}"></script>
  {% endif %}
{% endif %}
